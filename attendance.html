<!DOCTYPE html>
<html lang="th" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Dashboard</title>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#fafafa;--card:#fff;--line:#ececec;--text:#1f2328;--muted:#8a8f98;--hover:#f6f7f9;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--accent:var(--text);--on-accent:var(--card);--fs:14px;--font:'IBM Plex Sans Thai'}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a20;--line:#2a2f37;--text:#e6e8eb;--muted:#8b929c;--hover:#1f232b;--danger:#f87171;--warn:#fbbf24;--ok:#4ade80}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0f1115;--card:#171a20;--line:#2a2f37;--text:#e6e8eb;--muted:#8b929c;--hover:#1f232b;--danger:#f87171;--warn:#fbbf24;--ok:#4ade80}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:var(--font),'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs)}
header{display:flex;align-items:center;gap:8px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--danger)}.btn.icon{padding:6px 10px}.btn.sm{padding:3px 9px;font-size:.88em}
.link{color:var(--accent);cursor:pointer;background:none;border:0;font:inherit;padding:0}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;background:var(--card);color:inherit}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
input.ab{width:52px;text-align:center}input.n{width:72px}
main{max-width:1280px;margin:0 auto;padding:16px 24px 60px}
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--text);border-color:var(--accent);font-weight:500}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;text-align:center;margin-left:4px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.grid .card{margin:0}
.kpi .label{color:var(--muted);font-size:12px}
.kpi .value{font-size:26px;font-weight:600;margin-top:2px}
.kpi .value small{font-size:14px;color:var(--muted);font-weight:400}
.kpi .sub{font-size:12px;color:var(--muted);min-height:16px}
.kpi.bad .value{color:var(--danger)}.kpi.warn .value{color:var(--warn)}
.kpi[data-act]{cursor:pointer}.kpi[data-act]:hover{border-color:var(--muted)}
.kpi.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .go{float:right;color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:860px){.row,.row2{grid-template-columns:1fr}}
h3{font-size:13px;font-weight:600;margin-bottom:12px}
h3 .r{float:right;font-weight:400}
.muted{color:var(--muted);font-weight:400}
.small{font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
th[data-act]{cursor:pointer}th[data-act]:hover{color:var(--text)}
tr.click:hover td{background:var(--hover);cursor:pointer}
tr.void td{text-decoration:line-through;color:var(--muted)}
td.raw{font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin:1px 0}
.st{background:color-mix(in srgb,var(--c) 17%,var(--card));color:color-mix(in srgb,var(--c) 80%,var(--text))}
.p-bad{--c:#dc2626}.p-warn{--c:#d97706}.p-ok{--c:#16a34a}.p-gray{--c:#6b7280}
.bars{display:flex;gap:3px;height:160px;align-items:flex-end}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.bar .col{height:135px;width:100%;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;background:color-mix(in srgb,var(--muted) 40%,var(--card));border-radius:4px 4px 0 0}
.bar i.low{background:color-mix(in srgb,var(--danger) 45%,var(--card))}.bar.sel i{background:var(--accent)}
.bar span{font-size:10px;color:var(--muted);margin-top:4px}
.list{list-style:none;padding:0;max-height:280px;overflow:auto}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li[data-act]{cursor:pointer}.list li[data-act]:hover{background:var(--hover)}
.list .num{font-weight:600}
.cal td,.cal th{padding:3px;text-align:center}
.cal .name{text-align:left;position:sticky;left:0;background:var(--card);padding-right:12px;cursor:pointer;z-index:1}
.cal th.sun{color:var(--danger)}.cal th[data-act]{cursor:pointer}
.cell{display:inline-flex;min-width:26px;height:26px;padding:0 3px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend .cell{min-width:20px;height:20px;margin-right:4px;vertical-align:middle}
.rate{display:inline-block;width:60px;height:6px;background:var(--line);border-radius:3px;margin-right:6px;vertical-align:middle;overflow:hidden}
.rate b{display:block;height:100%;background:var(--muted)}.rate b.low{background:var(--danger)}.rate b.mid{background:var(--warn)}
.empty{max-width:520px;margin:8vh auto;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:48px 24px;background:var(--card)}
.empty h2{font-size:18px;margin-bottom:8px}.empty p{margin-bottom:18px}
.modal{position:fixed;inset:0;background:rgba(15,17,20,.4);display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;z-index:20;overflow:auto}
.sheet{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:900px}
.sheet.narrow{max-width:620px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.mhead h2{font-size:18px}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 16px}
.strip div{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted)}
.form label{display:block;margin-bottom:12px;font-size:.92em;color:var(--muted)}
.form label>input[type=text],.form label>input[type=date],.form label>select,.form label>textarea{width:100%;margin-top:4px;color:var(--text)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin:10px 0 4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30}
.upl{display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:var(--card);color:inherit;font-family:inherit}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip .x{margin-left:6px;opacity:.6}
.set td{padding:5px 6px;vertical-align:middle}
.set td input[type=text]{width:100%;min-width:140px}
.set td input.ab{width:52px;min-width:0}
.sec{margin-bottom:14px}
.sec>h3{font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.cond{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.box{background:var(--hover);border-radius:10px;padding:12px;margin-top:10px}
.guess{color:var(--muted);font-style:italic}
.cell.chg{box-shadow:0 0 0 2px var(--warn)}
.sync{font-size:12px;color:var(--muted)}.sync.err{color:var(--danger)}.sync.ok{color:var(--ok)}
.diff{font-size:12px}.diff del{color:var(--danger)}.diff ins{color:var(--ok);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>Attendance</h1>
  <select id="branch" title="สาขา"></select>
  <select id="shiftSel" title="กะ"></select>
  <select id="month" title="เดือน"></select>
  <label class="btn upl">อัปโหลด<input type="file" class="fileIn" accept=".xlsx,.xls" multiple hidden></label>
  <button class="btn" data-act="export">ส่งออก Excel</button>
  <button class="btn" id="syncBtn" data-act="syncNow" hidden title="ซิงค์กับ Google Sheets"></button>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
/* ================= การเชื่อมต่อ Google Sheets (ใส่ตรงนี้ครั้งเดียว) =================
   ใส่ URL ของ Apps Script และรหัสลับ (TOKEN) ให้ตรงกับใน sheets-script/token.gs
   ถ้าใส่ไว้ ทุกเครื่องที่เปิดหน้านี้จะเชื่อมต่อ บันทึก และดึงข้อมูลจากชีตอัตโนมัติ ไม่ต้องกรอกเอง
   ⚠ ใครได้ไฟล์นี้หรือเปิดหน้าเว็บนี้ได้ จะเข้าถึงข้อมูลในชีตได้ทั้งหมด */
// URL เปิดเผยได้ (ไม่มีรหัสลับก็อ่าน/แก้ข้อมูลไม่ได้) · แต่ละเครื่องกรอกรหัสลับครั้งแรกครั้งเดียว
const SHEETS_URL   = 'https://script.google.com/macros/s/AKfycbyiO8LuaI20Iuaem8kPE2o_ZMWv40axuq59VG2GXPpgFfIVCKtUBTu6M1uVgGcGkW8-/exec';
const SHEETS_TOKEN = '';   // ห้ามใส่ เพราะ repo เป็นสาธารณะ (รหัสลับอยู่ใน sheets-script/token.gs)

/* ================= ค่าเริ่มต้น ================= */
const DEFAULTS = {
  shifts: [
    { id:'s1', name:'03.00–12.00', start:'03:00', end:'12:00', grace:0 },
    { id:'s2', name:'09.00–18.00', start:'09:00', end:'18:00', grace:0 },
    { id:'s3', name:'15.00–00.00', start:'15:00', end:'00:00', grace:0 },
    { id:'s4', name:'18.00–03.00', start:'18:00', end:'03:00', grace:0 },
  ],
  // ลำดับ = ความสำคัญ (บนสุดชนะ)
  statuses: [
    { key:'holwork',  name:'ทำงานวันหยุด',   abbr:'H',  color:'#9333ea', countAs:'present', value:1 },
    { key:'noout',    name:'ไม่สแกนออก',     abbr:'!',  color:'#ea580c', countAs:'present', value:1 },
    { key:'half',     name:'มา + ลาครึ่งวัน', abbr:'½',  color:'#2563eb', countAs:'present', value:1 },
    { key:'late',     name:'มาสาย',          abbr:'ส',  color:'#ca8a04', countAs:'present', value:1 },
    { key:'present',  name:'มาทำงาน',        abbr:'✓',  color:'#16a34a', countAs:'present', value:1 },
    { key:'sick',     name:'ลาป่วย',         abbr:'ป',  color:'#d97706', countAs:'leave', leaveType:'sick', value:1 },
    { key:'vac',      name:'ลาพักร้อน',      abbr:'พ',  color:'#0891b2', countAs:'leave', leaveType:'vac', value:1 },
    { key:'personal', name:'ลากิจ',          abbr:'ก',  color:'#a16207', countAs:'leave', leaveType:'personal', value:1 },
    { key:'unpaid',   name:'ลาไม่รับค่าจ้าง', abbr:'ม',  color:'#be123c', countAs:'leave', leaveType:'unpaid', value:1 },
    { key:'leave',    name:'ลาอื่นๆ',         abbr:'ล',  color:'#b45309', countAs:'leave', leaveType:'other', value:1 },
    { key:'ph',       name:'วันหยุด PH',     abbr:'PH', color:'#7c3aed', countAs:'off', value:0 },
    { key:'off',      name:'วันหยุด',        abbr:'–',  color:'#6b7280', countAs:'off', value:0 },
    { key:'absent',   name:'ขาด / ไม่มีสแกน', abbr:'?',  color:'#dc2626', countAs:'absent', value:0 },
  ],
  rules: [
    { id:'r1', name:'มาสายบ่อย',      metric:'lateCount',    param:15, threshold:8, period:'month', days:30 },
    { id:'r2', name:'ขาดงาน',         metric:'absent',       param:'', threshold:3, period:'month', days:30 },
    { id:'r3', name:'ขาดงานติดกัน',   metric:'absentStreak', param:'', threshold:2, period:'month', days:30 },
    { id:'r4', name:'ลาป่วยบ่อย',     metric:'sick',         param:'', threshold:4, period:'month', days:30 },
    { id:'r5', name:'ลืมสแกนออกบ่อย', metric:'noOut',        param:'', threshold:3, period:'month', days:30 },
  ],
  levels: ['ตักเตือนด้วยวาจา','ใบเตือนครั้งที่ 1','ใบเตือนครั้งที่ 2','ใบเตือนครั้งสุดท้าย'],
  general: { alertRate:80, nearPct:70, guessShift:true, guessWindow:180 },
  look: { font:'IBM Plex Sans Thai', size:14, theme:'auto', accent:'' },
  data: { autoXlsx:false, gasUrl:'' }
};
const FONTS = ['IBM Plex Sans Thai','Sarabun','Prompt','Kanit','Noto Sans Thai','Anuphan','Bai Jamjuree','Chakra Petch','Mitr'];
const COUNT_AS = { present:'มาทำงาน', leave:'ลา', absent:'ขาดงาน', off:'วันหยุด', none:'ไม่นับ' };
const LEAVE_T = { sick:'ป่วย', vac:'พักร้อน', personal:'กิจ', unpaid:'ไม่รับค่าจ้าง', other:'อื่นๆ' };

/* ================= เก็บข้อมูล (IndexedDB ในเครื่อง + Google Sheets) ================= */
const K = { rec:'att_records_v2', cfg:'att_config_v2', emp:'att_emps_v1', warn:'att_warnings_v1', chg:'att_changes_v1', sum:'att_sums_v1',
  meta:'att_sync_meta_v1', pend:'att_sync_pending_v1', conn:'att_conn_v1' };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const clone = o => JSON.parse(JSON.stringify(o));
function mergeCfg(c) {
  const d = clone(DEFAULTS);
  if (!c) return d;
  return { ...d, ...c, general:{ ...d.general, ...c.general }, look:{ ...d.look, ...c.look }, data:{ ...d.data, ...c.data } };
}
let DB = {}, CFG = mergeCfg(null), EMP = {}, WARN = [], CHG = [], SUM = {};
let META = { months:{}, store:{} }, PEND = { rows:{}, sums:{}, store:{} }, CONN = { url:'', token:'' };

/* IndexedDB เก็บได้หลายร้อย MB (localStorage ได้แค่ ~5MB) */
const IDB = {
  db: null,
  open() { return new Promise((res, rej) => { const q = indexedDB.open('attendance', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => { this.db = q.result; res(); }; q.onerror = () => rej(q.error); }); },
  get(k) { return new Promise(res => { try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch { res(undefined); } }); },
  set(k, v) { return new Promise(res => { try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => { toast('บันทึกข้อมูลในเครื่องไม่ได้'); res(false); }; } catch { res(false); } }); }
};
function persist(k, v) {
  if (IDB.db) return IDB.set(k, v);
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast('บันทึกไม่ได้: พื้นที่ในเบราว์เซอร์เต็ม'); return false; }
}
const saveDB = () => persist(K.rec, DB);
const saveCfg = localOnly => { CACHE.clear(); persist(K.cfg, CFG); if (!localOnly) markStore('CFG'); };
const saveEmp = () => { CACHE.clear(); persist(K.emp, EMP); markStore('EMP'); };
const saveWarn = () => { persist(K.warn, WARN); markStore('WARN'); };
const saveChg = () => { if (CHG.length > 1000) CHG.length = 1000; persist(K.chg, CHG); markStore('CHG'); };
const saveSync = () => { persist(K.meta, META); persist(K.pend, PEND); };
const saveConn = () => localStorage.setItem(K.conn, JSON.stringify(CONN));

async function boot() {
  try { await IDB.open(); } catch { IDB.db = null; }
  const get = async (k, d) => { if (IDB.db) { const v = await IDB.get(k); if (v !== undefined) return v; } return load(k, d); };
  DB = await get(K.rec, null);
  if (!DB) { // ย้ายข้อมูลจากเวอร์ชันแรก
    const old = load('att_records_v1', {}); DB = {};
    Object.entries(old).forEach(([k, r]) => DB[k] = { id:r.id, name:r.name, pos:r.pos, branch:r.branch, date:r.date, raw:r.raw, src:r.src });
  }
  CFG = mergeCfg(await get(K.cfg, null));
  EMP = await get(K.emp, {}); WARN = await get(K.warn, []); CHG = await get(K.chg, []); SUM = await get(K.sum, {});
  META = await get(K.meta, META); PEND = await get(K.pend, PEND);
  CONN = load(K.conn, null) || { url:CFG.data.gasUrl || load('att_settings_v1', {})?.gasUrl || '', token:'' };
  if (SHEETS_URL) CONN.url = SHEETS_URL;
  if (SHEETS_TOKEN) CONN.token = SHEETS_TOKEN;
  if (IDB.db && localStorage.getItem(K.rec)) { // ย้ายจาก localStorage ไป IndexedDB แล้วลบของเก่า
    await Promise.all([IDB.set(K.rec, DB), IDB.set(K.cfg, CFG), IDB.set(K.emp, EMP), IDB.set(K.warn, WARN)]);
    [K.rec, K.cfg, K.emp, K.warn].forEach(k => localStorage.removeItem(k));
  }
  applyLook(); render(); setSync('');
  if (CONN.url && !CONN.token) openTokenPrompt(); // เครื่องใหม่: ถามรหัสลับครั้งเดียว
  else if (CONN.url) {
    // ครั้งแรกที่เครื่องนี้ต่อกับชีต: ถ้าชีตยังว่างแต่ในเครื่องมีข้อมูล ส่งขึ้นไปให้เลย
    if (!Object.keys(META.months).length && Object.keys(DB).length) {
      try { const m = await api('meta'); if (!Object.keys(m.months).length) markAllPending(); } catch {}
    }
    sync(true);
  }
  // ดึงข้อมูลใหม่จากชีตทุก 5 นาที และทุกครั้งที่กลับมาที่หน้านี้
  setInterval(() => { if (CONN.url && !document.hidden) sync(true); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (CONN.url && !document.hidden) sync(true); });
}

let state = { tab:'day', month:null, date:null, branch:'all', shift:'all', sort:{ k:'rate', d:1 }, q:'', eq:'', dayF:null, warnF:'all' };
let W = []; // ผลประเมินใบเตือน (คำนวณทุกครั้งที่ render)

/* ================= เครื่องมือ ================= */
const $ = s => document.querySelector(s);
const TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const WD = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const WDL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

/* ================= อ่านไฟล์ ================= */
function toISO(v) {
  if (typeof v === 'number' && v > 30000 && v < 80000) {
    const d = XLSX.SSF.parse_date_code(v);
    return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) { const y = +m[1] > 2400 ? +m[1] - 543 : +m[1]; return `${y}-${m[2]}-${m[3]}`; }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // dd/mm/yyyy (รองรับ พ.ศ.)
  if (m) { const y = +m[3] > 2400 ? +m[3] - 543 : +m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return null;
}

const LEAVE_RE = /ลา(ป่วย|พักร้อน|ไม่รับค่าจ้าง|กิจ)\s*(ครึ่งวัน|(\d+(?:\.\d+)?)\s*วัน)?/g;
const LEAVE_MAP = { 'ป่วย':'sick', 'พักร้อน':'vac', 'ไม่รับค่าจ้าง':'unpaid', 'กิจ':'personal' };
function classify(t) {
  const mi = t.match(/^in:(\d{1,2}:\d{2})/), mo = t.match(/out:(\d{1,2}:\d{2})/);
  // แยกการลาแต่ละรายการ เช่น "ลาพักร้อนครึ่งวันเช้า ลาป่วยครึ่งวันบ่าย" → พักร้อน 0.5 + ป่วย 0.5
  const parts = [...t.matchAll(LEAVE_RE)].map(m => ({ type:LEAVE_MAP[m[1]], amt: m[2] === 'ครึ่งวัน' ? 0.5 : Math.min(1, m[3] ? +m[3] : 1) }));
  const leaves = parts.map(p => p.type);
  const status = mi ? 'present' : t.startsWith('in:--') ? 'noscan' : t.startsWith('วันหยุด') ? 'off' : t.startsWith('ลา') ? 'leave' : 'check';
  const r = {
    status, leaves, parts,
    halfText: t.includes('ครึ่งวัน'),
    halfAM: t.includes('ครึ่งวันเช้า'), halfPM: t.includes('ครึ่งวันบ่าย'),
    half: status === 'present' && t.includes('ครึ่งวัน'),
    cin: mi ? mi[1].padStart(5,'0') : null, cout: mo ? mo[1].padStart(5,'0') : null,
    ph: /PH/.test(t),
    holWork: status === 'present' && /(PH|วันหยุด)/.test(t)
  };
  r.noOut = status === 'present' && !r.cout;
  if (r.cin && r.cout) { let m = toMin(r.cout) - toMin(r.cin); if (m < 0) m += 1440; r.hours = +(m / 60).toFixed(2); }
  else r.hours = null;
  return r;
}

function parseWorkbook(wb, fileName) {
  const out = [], sums = {};
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:true });
    const h = rows.findIndex(r => r.some(c => String(c).trim() === 'รหัสพนักงาน'));
    if (h < 0) return;
    const head = rows[h].map(c => String(c).trim());
    const ix = n => head.indexOf(n);
    const cell = (r, n) => ix(n) < 0 ? '' : String(r[ix(n)] ?? '').trim();
    const dateCols = rows[h].map((c,i) => ({ i, d: toISO(c) })).filter(x => x.d);
    const month = dateCols[0]?.d.slice(0,7);
    for (const r of rows.slice(h + 1)) {
      const id = cell(r, 'รหัสพนักงาน');
      if (!id) continue;
      const base = {
        id,
        name: cell(r, 'ชื่อ-สกุล').replace(/\s+/g,' '),
        pos: cell(r, 'ตำแหน่ง'),
        branch: cell(r, 'สาขา') || '-',
        empStatus: cell(r, 'สถานะพนักงาน')
      };
      // ตัวเลขสรุปของบริษัท (ถ้ามี) เก็บไว้เทียบกับที่โปรแกรมคำนวณ
      if (month && ix('จำนวนครั้งที่สาย') >= 0) sums[id + '|' + month] = { id, month,
        absent:+cell(r,'จำนวนวันที่ขาดงาน') || 0, lateN:+cell(r,'จำนวนครั้งที่สาย') || 0, lateMin:+cell(r,'เวลาที่สาย(นาที)') || 0,
        earlyN:+cell(r,'จำนวนครั้งที่ออกงานก่อนเวลา') || 0, earlyMin:+cell(r,'ออกงานก่อนเวลา(นาที)') || 0 };
      for (const { i, d } of dateCols) {
        const raw = String(r[i] ?? '').replace(/\s+/g,' ').trim();
        if (!raw) continue;
        out.push({ ...base, date:d, raw, src:fileName });
      }
    }
  });
  return { recs:out, sums };
}

let busyUpload = false;
async function handleFiles(files) {
  if (busyUpload) return;
  busyUpload = true;
  try {
    const all = [], sums = {};
    for (const f of files) {
      try { const r = parseWorkbook(XLSX.read(await f.arrayBuffer(), { type:'array' }), f.name); all.push(...r.recs); Object.assign(sums, r.sums); }
      catch (e) { toast('อ่านไฟล์ไม่ได้: ' + f.name); }
    }
    if (!all.length) { toast('ไม่พบข้อมูล (หาคอลัมน์ "รหัสพนักงาน" หรือคอลัมน์วันที่ไม่เจอ)'); return; }
    // ดึงข้อมูลล่าสุดจาก Google Sheets ก่อน เพื่อเทียบการเปลี่ยนแปลงกับข้อมูลที่ถูกต้องที่สุด
    if (CONN.url) { toast('กำลังตรวจข้อมูลล่าสุดจาก Google Sheets…'); await sync(true); }
    const at = Date.now(), changed = [];
    let added = 0, same = 0;
    for (const r of all) {
      const k = r.id + '|' + r.date, old = DB[k];
      if (!old) { added++; DB[k] = { ...r, u:at }; PEND.rows[k] = 1; continue; }
      if (old.raw !== r.raw) {
        const oldSt = enrich(old).st.name;
        DB[k] = { ...r, u:at, prev:old.raw }; PEND.rows[k] = 1;
        changed.push({ id:uid('h'), k, emp:r.id, name:r.name, date:r.date, old:old.raw, neu:r.raw, oldSt, at, src:r.src });
        continue;
      }
      same++;
      if (old.name !== r.name || old.pos !== r.pos || old.branch !== r.branch || old.empStatus !== r.empStatus) { DB[k] = { ...old, name:r.name, pos:r.pos, branch:r.branch, empStatus:r.empStatus }; PEND.rows[k] = 1; }
    }
    Object.entries(sums).forEach(([k, v]) => { if (JSON.stringify(SUM[k]) !== JSON.stringify(v)) { SUM[k] = v; PEND.sums[k] = 1; } });
    CACHE.clear();
    changed.forEach(c => c.neuSt = enrich(DB[c.k]).st.name);
    if (changed.length) { CHG.unshift(...changed); saveChg(); }
    saveDB(); persist(K.sum, SUM); saveSync();
    const last = all.map(r => r.date).sort().at(-1);
    state.month = last.slice(0,7); state.date = last;
    if (['settings','emp'].includes(state.tab)) state.tab = 'day';
    render();
    if (changed.length) openChanges(changed, `นำเข้าแล้ว: ใหม่ ${added} · เปลี่ยนแปลง ${changed.length} · เหมือนเดิม ${same}`);
    else toast(`นำเข้าแล้ว: ใหม่ ${added} · เหมือนเดิม ${same} · ไม่มีวันที่ถูกแก้ย้อนหลัง`);
    if (CFG.data.autoXlsx) exportXlsx();
    if (CONN.url) sync();
  } finally { busyUpload = false; }
}

/* ================= กะ ================= */
function ovMatch(o, date) {
  if (o.type === 'dates') return (o.dates || []).includes(date);
  const inR = (!o.from || date >= o.from) && (!o.to || date <= o.to);
  if (o.type === 'weekdays') return inR && (o.wd || []).includes(new Date(date + 'T00:00').getDay());
  return inR && (o.from || o.to);
}
function shiftFor(id, date, cin, halfAM) {
  const e = EMP[id];
  if (e) {
    const ov = (e.ov || []).slice().reverse().find(o => ovMatch(o, date));
    if (ov && shiftById(ov.shift)) return { s:shiftById(ov.shift), g:false, ov:true };
    if (e.shift && shiftById(e.shift)) return { s:shiftById(e.shift), g:false };
  }
  if (CFG.general.guessShift) {
    // สแกนเข้าใกล้เวลาเข้ากะไหน (ไม่เกิน 60 นาที) ใช้กะนั้นของวันนั้น ไม่งั้นใช้กะที่คนนี้เข้าบ่อยสุดในเดือน
    const g = (cin && !halfAM && nearestShift(cin, 60)) || personGuess(id, date.slice(0,7)) || (cin && nearestShift(cin));
    if (g) return { s:g, g:true };
  }
  return { s:null, g:false };
}
function nearestShift(cin, win) {
  let best = null, bd = 1e9;
  for (const s of CFG.shifts) { const d = Math.abs(norm(toMin(cin) - toMin(s.start))); if (d < bd) { bd = d; best = s; } }
  return bd <= Math.min(win ?? 1e9, +CFG.general.guessWindow || 180) ? best : null;
}
/* เดากะของแต่ละคนต่อเดือน = กะที่เวลาสแกนเข้าใกล้ที่สุดบ่อยที่สุด (ไม่นับวันลาครึ่งวันเช้า) */
let GUESS = null;
function personGuess(id, month) {
  if (!GUESS) {
    const cnt = {}; GUESS = {};
    Object.values(DB).forEach(r => {
      const m = r.raw.match(/^in:(\d{1,2}:\d{2})/);
      if (!m || r.raw.includes('ครึ่งวันเช้า')) return;
      const s = nearestShift(m[1]); if (!s) return;
      const c = cnt[r.id + '|' + r.date.slice(0,7)] ??= {}; c[s.id] = (c[s.id] || 0) + 1;
    });
    Object.entries(cnt).forEach(([k, c]) => GUESS[k] = shiftById(Object.entries(c).sort((a,b) => b[1] - a[1])[0][0]));
  }
  return GUESS[id + '|' + month];
}

const BASE_OPTS = [['present','มีสแกนเข้า'],['leave','ลา'],['off','วันหยุด'],['noscan','ไม่มีสแกน'],['check','อ่านไม่ออก'],['half','ลาครึ่งวัน'],['ph','PH'],['holWork','ทำงานวันหยุด'],['noOut','ไม่สแกนออก']];
const FIELDS = {
  raw:   { label:'ข้อความดิบ', type:'text', get:c => c.raw },
  base:  { label:'สถานะพื้นฐาน', type:'sel', opts:() => BASE_OPTS, get:c => [c.status, c.half && 'half', c.ph && 'ph', c.holWork && 'holWork', c.noOut && 'noOut'].filter(Boolean) },

  wd:    { label:'วันในสัปดาห์', type:'sel', opts:() => WDL.map((w,i) => [String(i), w]), get:c => String(c.wd) },
  date:  { label:'วันที่', type:'date', get:c => c.date },

  id:    { label:'รหัสพนักงาน', type:'text', get:c => c.id },

};
const OPS = {
  text: [['contains','มีคำว่า'],['notContains','ไม่มีคำว่า'],['startsWith','ขึ้นต้นด้วย'],['is','เท่ากับ'],['isNot','ไม่เท่ากับ'],['empty','ว่าง'],['notEmpty','ไม่ว่าง']],
  time: [['before','ก่อน'],['after','หลัง'],['empty','ไม่มี'],['notEmpty','มี']],
  num:  [['gt','มากกว่า'],['gte','ตั้งแต่'],['lt','น้อยกว่า'],['lte','ไม่เกิน'],['eq','เท่ากับ']],
  sel:  [['is','เป็น'],['isNot','ไม่ใช่']],
  date: [['from','ตั้งแต่'],['to','ถึง'],['is','ตรงกับ']],
};
function evalCond(c, k) {
  const F = FIELDS[k.f]; if (!F) return false;
  const v = F.get(c), x = k.v ?? '';
  switch (k.op) {
    case 'contains': return x !== '' && String(v ?? '').includes(x);
    case 'notContains': return x !== '' && !String(v ?? '').includes(x);
    case 'startsWith': return x !== '' && String(v ?? '').startsWith(x);
    case 'is': return Array.isArray(v) ? v.includes(x) : String(v ?? '') === String(x);
    case 'isNot': return Array.isArray(v) ? !v.includes(x) : String(v ?? '') !== String(x);
    case 'empty': return v == null || v === '';
    case 'notEmpty': return v != null && v !== '';
    case 'before': return v != null && x !== '' && toMin(v) < toMin(x);
    case 'after': return v != null && x !== '' && toMin(v) > toMin(x);
    case 'gt': return v != null && +v > +x;
    case 'gte': return v != null && +v >= +x;
    case 'lt': return v != null && +v < +x;
    case 'lte': return v != null && +v <= +x;
    case 'eq': return v != null && +v === +x;
    case 'from': return x !== '' && v >= x;
    case 'to': return x !== '' && v <= x;
  }
  return false;
}
function matchCustom(s, c) {
  const cs = (s.conds || []).filter(k => k.f && k.op);
  if (!cs.length) return false;
  return s.mode === 'any' ? cs.some(k => evalCond(c, k)) : cs.every(k => evalCond(c, k));
}
const TODAY_ST = { key:'_today', name:'ยังไม่มีสแกน (วันนี้)', abbr:'…', color:'#9ca3af', countAs:'none', value:0 };
function statusOf(c) {
  if (c.status === 'today') return TODAY_ST;
  for (const s of CFG.statuses) if (s.custom ? matchCustom(s, c) : BUILTIN[s.key]?.(c)) return s;
  return UNKNOWN;
}

/* ================= คำนวณ ================= */
const CACHE = new Map();
{ const clr = CACHE.clear.bind(CACHE); CACHE.clear = () => { GUESS = null; clr(); }; }
function enrich(r) {
  const k = r.id + '|' + r.date;
  let c = CACHE.get(k); if (c && c.raw === r.raw) return c;
  c = { ...r, ...classify(r.raw) };
  // วันนี้ยังไม่สแกนออก = ยังทำงานอยู่ ไม่นับเป็น "ลืมสแกนออก"
  if (c.noOut && r.date >= today()) { c.noOut = false; c.ongoing = true; }
  // วันนี้ยังไม่มีสแกน = ยังไม่ถึงเวลาเข้างาน ไม่นับเป็นขาด
  if (c.status === 'noscan' && r.date >= today()) c.status = 'today';
  const sh = shiftFor(r.id, r.date, c.cin, c.halfAM);
  c.shift = sh.s; c.shiftGuess = sh.g; c.shiftOv = !!sh.ov;
  c.late = 0; c.early = 0;
  if (c.shift && c.status === 'present') {
    // ลาครึ่งวันเช้า → ไม่คิดมาสาย / ลาครึ่งวันบ่าย → ไม่คิดกลับก่อน
    if (c.cin && !c.halfAM) { const d = norm(toMin(c.cin) - toMin(c.shift.start)); if (d > (+c.shift.grace || 0)) c.late = d; }
    if (c.cout && !c.halfPM) { const d = norm(toMin(c.shift.end) - toMin(c.cout)); if (d > 0) c.early = d; }
  }
  c.wd = new Date(r.date + 'T00:00').getDay();
  c.st = statusOf(c);
  CACHE.set(k, c); return c;
}
const shiftOk = c => state.shift === 'all' || (state.shift === '_none' ? !c.shift : c.shift?.id === state.shift);

  return Object.values(DB).filter(r => (state.branch === 'all' || r.branch === state.branch) && r.date.startsWith(month)).map(enrich).filter(shiftOk);
}

const isLeave = c => c.st.countAs === 'leave';
function leaveCredit(c) {
  const s = c.st, o = {};
  if (s.custom) { if (s.countAs === 'leave') o[s.leaveType || 'other'] = +s.value || 0; return o; }
  if (s.countAs === 'leave' || s.key === 'half') {
    if (c.parts.length) c.parts.forEach(p => o[p.type] = (o[p.type] || 0) + p.amt);
    else o[s.leaveType || 'other'] = c.halfText ? 0.5 : 1;
  }
  return o;
}

function dayStats(rs) {
  let total = 0, off = 0, must = 0, present = 0, leave = 0, absent = 0, late = 0, lateMin = 0, noOut = 0, half = 0;
  for (const c of rs) {
    const a = c.st.countAs; if (a === 'none') continue;
    total++;
    if (a === 'off') { off++; continue; }
    must++;
    if (a === 'present') present += +c.st.value || 0;
    if (a === 'leave') leave++;
    if (a === 'absent') absent++;
    if (c.late > 0) { late++; lateMin += c.late; }
    if (c.noOut) noOut++;
    if (c.half) half++;
  }
  return { total, off, must, present:fmtN(present), leave, absent, late, lateMin, noOut, half, raw:pct(present, total), real:pct(present, must) };
}

function personStats(recs) {
  const m = new Map();
  const sorted = [...recs].sort((a,b) => a.date.localeCompare(b.date));
  for (const c of sorted) {
    let p = m.get(c.id);
    if (!p) { p = { id:c.id, name:c.name, short:short(c.name), pos:c.pos, branch:c.branch, days:0, off:0, must:0, present:0, absent:0,
      sick:0, vac:0, unpaid:0, personal:0, other:0, half:0, holWork:0, noOut:0, late:0, lateMin:0, early:0, earlyMin:0,
      hrs:0, hrsN:0, absentStreak:0, _streak:0, nearHol:0, sc:{}, shifts:{}, _arr:[] }; m.set(c.id, p); }
    p._arr.push(c);
    p.days++;
    p.sc[c.st.key] = (p.sc[c.st.key] || 0) + 1;
    if (c.shift) p.shifts[c.shift.name] = (p.shifts[c.shift.name] || 0) + 1;
    const a = c.st.countAs;
    if (a === 'none') continue;
    if (a === 'off') { p.off++; continue; }
    p.must++;
    if (a === 'present') p.present += +c.st.value || 0;
    if (a === 'absent') { p.absent++; p._streak++; p.absentStreak = Math.max(p.absentStreak, p._streak); } else p._streak = 0;
    Object.entries(leaveCredit(c)).forEach(([k,v]) => p[k] = (p[k] || 0) + v);
    if (c.status === 'present') {
      if (c.half) p.half++;
      if (c.holWork) p.holWork++;
      if (c.noOut) p.noOut++;
      if (c.late > 0) { p.late++; p.lateMin += c.late; }
      if (c.early > 0) { p.early++; p.earlyMin += c.early; }
      if (c.hours != null) { p.hrs += c.hours; p.hrsN++; }
    }
  }
  return [...m.values()].map(p => {
    const arr = p._arr;
    arr.forEach((c, i) => { if (isLeave(c) && (arr[i-1]?.st.countAs === 'off' || arr[i+1]?.st.countAs === 'off')) p.nearHol++; });
    const top = Object.entries(p.shifts).sort((a,b) => b[1] - a[1])[0];
    const leaveAll = p.sick + p.vac + p.unpaid + p.personal + p.other;
    return { ...p, present:fmtN(p.present), leaveAll:fmtN(leaveAll), rate:pct(p.present, p.must), avgH:p.hrsN ? +(p.hrs / p.hrsN).toFixed(1) : null, shiftName: top ? top[0] : '' };
  });
}

};
const PERIODS = { month:'ต่อเดือน (เดือนที่เลือก)', days:'ย้อนหลัง N วัน', year:'ต่อปี' };
function ruleText(rule) {
  const M = METRICS[rule.metric]; if (!M) return rule.name;
  let t = M.label.replace('X', rule.param || 0);
  if (M.param === 'status') t += ' "' + (CFG.statuses.find(s => s.key === rule.param)?.name || '?') + '"';
  return M.rate ? `${t} ${rule.threshold}%` : `${t} ≥ ${rule.threshold} ${M.unit}`;
}
function warnEval() {
  const base = Object.values(DB).filter(r => state.branch === 'all' || r.branch === state.branch);
  if (!base.length || !state.month) return [];
  const latest = base.reduce((m,r) => r.date > m ? r.date : m, '');
  const out = [], near = (+CFG.general.nearPct || 70) / 100;
  for (const rule of CFG.rules) {
    const M = METRICS[rule.metric]; if (!M) continue;
    let from, to, label;
    if (rule.period === 'year') { const y = state.month.slice(0,4); from = y + '-01-01'; to = y + '-12-31'; label = 'ปี ' + y; }
    else if (rule.period === 'days') { const n = +rule.days || 30, d = new Date(latest + 'T00:00'); d.setDate(d.getDate() - n + 1); from = iso(d); to = latest; label = n + ' วันล่าสุด'; }
    else { from = state.month + '-01'; to = state.month + '-31'; label = thMonth(state.month); }
    const g = groupBy(base.filter(r => r.date >= from && r.date <= to).map(enrich), c => c.id);
    for (const [id, arr] of Object.entries(g)) {
      const p = personStats(arr)[0];
      let val, prog, hit;
      const th = +rule.threshold || 0;
      if (M.rate) { val = p.rate; if (val == null) continue; hit = val < th; prog = val >= 100 ? 0 : (100 - val) / Math.max(100 - th, 0.01); }
      else { val = fmtN(M.fn(p._arr, p, rule.param)); hit = th > 0 && val >= th; prog = th > 0 ? val / th : 0; }
      if (prog <= 0) continue;
      const pkey = `${rule.id}|${from}|${to}`;
      const warned = WARN.find(w => !w.void && w.emp === id && w.pkey === pkey);
      out.push({ id, name:p.name, short:p.short, pos:p.pos, shift:p.shiftName, rule, label, val, prog, hit, near:hit || prog >= near, warned, pkey, unit:M.unit });
    }
  }
  return out.sort((a,b) => (b.hit - a.hit) || (b.prog - a.prog));
}

        <td>${esc(p.short)}</td><td class="muted">${esc(p.pos)}</td><td class="muted">${esc(p.shiftName) || '–'}</td><td>${p.must}</td><td>${p.present}</td>

        <td>${fmtN(p.sick) || ''}</td><td>${fmtN(p.vac) || ''}</td><td>${fmtN(p.personal) || ''}</td><td>${fmtN(p.unpaid) || ''}</td><td>${p.half || ''}</td><td>${p.holWork || ''}</td><td>${p.noOut || ''}</td><td>${p.avgH ?? '–'}</td>

function topList(title, arr, val, fmt, n = 8) {
  const xs = arr.filter(p => val(p) > 0).sort((a,b) => val(b) - val(a)).slice(0, n);
  return `<div class="card"><h3>${title}</h3>${xs.length ? `<ul class="list">${xs.map((p,i) => `<li data-act="person" data-id="${esc(p.id)}">
    <span><span class="muted">${i + 1}.</span> ${esc(p.short)} <span class="muted small">${esc(p.shiftName)}</span></span><span class="num">${fmt(p)}</span></li>`).join('')}</ul>` : '<p class="muted">ไม่มี</p>'}</div>`;
}
function viewStats(recs) {
  const ps = personStats(recs), all = dayStats(recs);
  const [y, m] = state.month.split('-').map(Number);
  const prevM = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2,'0')}`;
  const prev = recsFor(prevM), pAll = prev.length ? dayStats(prev) : null, pPs = prev.length ? personStats(prev) : [];
  const tot = (arr, k) => fmtN(arr.reduce((a,p) => a + (+p[k] || 0), 0));
  const cmp = (label, cur, old, unit = '', goodUp = false) => {
    let delta = '';
    if (old != null && cur != null) { const dd = fmtN(cur - old); if (dd) { const good = goodUp ? dd > 0 : dd < 0; delta = `<span style="color:var(${good ? '--ok' : '--danger'})">${dd > 0 ? '▲' : '▼'} ${Math.abs(dd)}${unit}</span>`; } else delta = '<span class="muted">เท่าเดิม</span>'; }
    return `<li><span>${label}</span><span><b>${cur ?? '–'}${unit}</b> <span class="muted small">เดือนก่อน ${old ?? '–'}${unit}</span> ${delta}</span></li>`;
  };
  const byShift = groupBy(recs, c => c.shift ? c.shift.name : 'ไม่ทราบกะ');
  const shiftRows = Object.entries(byShift).sort().map(([n, rs]) => { const s = dayStats(rs), pp = new Set(rs.map(r => r.id)).size;
    return `<tr><td>${esc(n)}</td><td>${pp}</td><td>${rateBar(s.real)}</td><td>${s.late}</td><td>${s.lateMin}</td><td>${s.leave}</td><td>${s.absent}</td></tr>`; }).join('');
  const byWd = groupBy(recs, c => c.wd);
  const wdBars = [1,2,3,4,5,6,0].map(w => { const s = byWd[w] ? dayStats(byWd[w]) : null, r = s?.real;
    return `<div class="bar" title="${WDL[w]} · ${fmtPct(r)}"><div class="col"><i class="${r != null && r < CFG.general.alertRate ? 'low' : ''}" style="height:${r || 0}%"></i></div><span>${WD[w]} ${r != null ? Math.round(r) + '%' : ''}</span></div>`; }).join('');
  const perfect = ps.filter(p => p.must > 0 && p.rate >= 100 && !p.late && !p.absent);
  const stCount = {}; recs.forEach(c => stCount[c.st.key] = (stCount[c.st.key] || 0) + 1);
  const totalRec = recs.length;
  return `
  <div class="grid">
    ${kpi('อัตรามาทำงานจริง', fmtPct(all.real), pAll ? 'เดือนก่อน ' + fmtPct(pAll.real) : '')}
    ${kpi('มาสาย', tot(ps,'late'), `ครั้ง · ${tot(ps,'lateMin')} นาที`, '', 'data-act="go" data-tab="people" data-sort="late"')}
    ${kpi('ลารวม', tot(ps,'leaveAll'), 'วัน', '', 'data-act="go" data-tab="people" data-sort="leaveAll"')}
    ${kpi('ขาดงาน', tot(ps,'absent'), 'วัน', tot(ps,'absent') ? 'bad' : '', 'data-act="go" data-tab="people" data-sort="absent"')}
    ${kpi('มาครบไม่สายเลย', perfect.length, 'คน')}
  </div>
  <div class="row3">
    ${topList('ลามากสุด (ทุกประเภท)', ps, p => +p.leaveAll, p => p.leaveAll + ' วัน')}
    ${topList('ลาป่วยมากสุด', ps, p => p.sick, p => fmtN(p.sick) + ' วัน')}
    ${topList('มาสายบ่อยสุด', ps, p => p.late * 10000 + p.lateMin, p => `${p.late} ครั้ง · ${p.lateMin} น.`)}
    ${topList('มาสายรวมนานสุด', ps, p => p.lateMin, p => p.lateMin + ' นาที')}
    ${topList('ขาดงานมากสุด', ps, p => p.absent, p => p.absent + ' วัน')}
    ${topList('ลืมสแกนออกบ่อยสุด', ps, p => p.noOut, p => p.noOut + ' ครั้ง')}
    ${topList('ลาติดวันหยุดบ่อย', ps, p => p.nearHol, p => p.nearHol + ' ครั้ง')}
    ${topList('กลับก่อนเวลาบ่อย', ps, p => p.early, p => `${p.early} ครั้ง · ${p.earlyMin} น.`)}
    ${topList('ชั่วโมงทำงานเฉลี่ยมากสุด', ps, p => p.avgH || 0, p => p.avgH + ' ชม.')}
    ${topList('อัตรามาทำงานต่ำสุด', ps.filter(p => p.rate != null && p.rate < 100), p => 100 - p.rate, p => fmtPct(p.rate))}
    ${topList('ทำงานวันหยุดมากสุด', ps, p => p.holWork, p => p.holWork + ' วัน')}
    <div class="card"><h3>มาครบไม่สายเลย (${perfect.length})</h3>${perfect.length ? `<ul class="list">${perfect.map(p => `<li data-act="person" data-id="${esc(p.id)}"><span>${esc(p.short)}</span><span class="muted small">${esc(p.shiftName)}</span></li>`).join('')}</ul>` : '<p class="muted">ไม่มี</p>'}</div>
  </div>
  <div class="row2">
    <div class="card"><h3>เทียบกับเดือนก่อน <span class="muted">(${thMonth(prevM)})</span></h3>
      ${pAll ? `<ul class="list" style="max-height:none">
        ${cmp('อัตรามาทำงานจริง', all.real, pAll.real, '%', true)}
        ${cmp('มาสาย (ครั้ง)', +tot(ps,'late'), +tot(pPs,'late'))}
        ${cmp('มาสายรวม (นาที)', +tot(ps,'lateMin'), +tot(pPs,'lateMin'))}
        ${cmp('ลารวม (วัน)', +tot(ps,'leaveAll'), +tot(pPs,'leaveAll'))}
        ${cmp('ลาป่วย (วัน)', +tot(ps,'sick'), +tot(pPs,'sick'))}
        ${cmp('ขาดงาน (วัน)', +tot(ps,'absent'), +tot(pPs,'absent'))}
        ${cmp('ลืมสแกนออก (ครั้ง)', +tot(ps,'noOut'), +tot(pPs,'noOut'))}
      </ul>` : '<p class="muted">ไม่มีข้อมูลเดือนก่อน</p>'}</div>
    <div class="card"><h3>อัตรามาทำงานตามวันในสัปดาห์</h3><div class="bars">${wdBars}</div></div>
  </div>
  <div class="row2">
    <div class="card"><h3>เทียบตามกะ</h3><div class="scroll"><table>
      <thead><tr><th>กะ</th><th>คน</th><th>อัตรา</th><th>สาย</th><th>สาย(น.)</th><th>ลา</th><th>ขาด</th></tr></thead><tbody>${shiftRows}</tbody></table></div></div>
    <div class="card"><h3>สัดส่วนสถานะทั้งเดือน</h3><ul class="list" style="max-height:none">${CFG.statuses.filter(s => stCount[s.key]).map(s =>
      `<li><span><span class="cell st" style="--c:${s.color}">${esc(s.abbr)}</span> ${esc(s.name)}</span><span>${stCount[s.key]} <span class="muted small">(${pct(stCount[s.key], totalRec)}%)</span></span></li>`).join('')}</ul></div>
  </div>`;
}

  <div class="grid">

    ${kpi('ใกล้ถึงเกณฑ์', nears, `ตั้งแต่ ${CFG.general.nearPct}% ของเกณฑ์`, nears ? 'warn' : '', 'data-act="warnf" data-f="near"')}

  </div>
  <div class="card">
    <div class="toolbar">${chip('all','ทั้งหมด')}${chip('hit','ถึงเกณฑ์')}${chip('near','ใกล้ถึง')}${chip('done','ออกใบแล้ว')}
      <span style="margin-left:auto"></span>

    <div class="scroll"><table>

        <td>${x.warned ? `<span class="pill st p-ok">ออกแล้ว ${thDate(x.warned.date)}</span>` : `<button class="btn sm ${x.hit ? 'primary' : ''}" data-act="warnIssue" data-id="${esc(x.id)}" data-rule="${x.rule.id}" data-pkey="${esc(x.pkey)}">ออกใบเตือน</button>`}</td>

  <div class="card">

let wDraft = null;
function openWarnForm(o) {
  const names = allEmployees();
  wDraft = { date:today(), level:CFG.levels[0] || '', reason:'', ...o };
  if (wDraft.rule && !o.reason) {
    const x = W.find(y => y.id === wDraft.emp && y.rule.id === wDraft.rule && y.pkey === wDraft.pkey);
    if (x) wDraft.reason = `${x.rule.name}: ${x.val} ${x.unit} (เกณฑ์ ${x.rule.threshold}) ช่วง ${x.label}`;
    const prev = WARN.filter(w => !w.void && w.emp === wDraft.emp).length;
    wDraft.level = CFG.levels[Math.min(prev, CFG.levels.length - 1)] || '';
  }
  const emp = names.find(e => e.id === wDraft.emp);
  showModal(`
  <div class="mhead"><h2>ออกใบเตือน${emp ? ' · ' + esc(short(emp.name)) : ''}</h2><button class="btn icon" data-act="close">✕</button></div>
  <div class="form">
    ${wDraft.emp ? '' : `<label>พนักงาน<select data-w="emp">${opt('', '— เลือก —', '')}${names.map(e => opt(e.id, `${short(e.name)} (${e.id})`, '')).join('')}</select></label>`}
    <div class="two">
      <label>วันที่<input type="date" data-w="date" value="${wDraft.date}"></label>
      <label>ระดับ<select data-w="level">${CFG.levels.map(l => opt(l, l, wDraft.level)).join('')}</select></label>
    </div>

    ${emp ? `<p class="hint">ใบเตือนก่อนหน้าของคนนี้: ${WARN.filter(w => !w.void && w.emp === emp.id).map(w => `${thDate(w.date)} ${esc(w.level)}`).join(', ') || 'ไม่มี'}</p>` : ''}
    <p class="hint" id="wErr" style="color:var(--danger)"></p>

  <div class="actions"><button class="btn" data-act="close">ยกเลิก</button><button class="btn primary" data-act="warnSave">บันทึกใบเตือน</button></div>`, true);
}

/* ================= หน้ากะพนักงาน ================= */
function allEmployees() {
  const m = new Map();
  Object.values(DB).sort((a,b) => a.date.localeCompare(b.date)).forEach(r => m.set(r.id, { id:r.id, name:r.name, pos:r.pos, branch:r.branch }));
  Object.keys(EMP).forEach(id => { if (!m.has(id)) m.set(id, { id, name:EMP[id].name || id, pos:'', branch:'' }); });
  return [...m.values()].sort((a,b) => a.name.localeCompare(b.name, 'th'));
}
function ovText(o) {
  const s = shiftById(o.shift)?.name || '?';
  if (o.type === 'dates') return `${(o.dates || []).map(d => thDate(d)).join(', ')} → ${s}`;
  const rng = o.from || o.to ? `${o.from ? thDate(o.from) : '…'} – ${o.to ? thDate(o.to) : '…'}` : 'ทุกช่วง';
  if (o.type === 'weekdays') return `ทุกวัน${(o.wd || []).map(w => WDL[w]).join('/')} (${rng}) → ${s}`;
  return `${rng} → ${s}`;
}
function viewEmp() {
  const emps = allEmployees();
  const month = state.month;
  const guess = {};
  if (month) Object.values(DB).filter(r => r.date.startsWith(month)).forEach(r => { const c = enrich(r); if (c.shiftGuess) { (guess[r.id] ??= {})[c.shift.name] = (guess[r.id][c.shift.name] || 0) + 1; } });
  const unassigned = emps.filter(e => !EMP[e.id]?.shift).length;
  const shiftOpts = sel => opt('', '— ไม่ระบุ (เดาจากเวลาสแกน) —', sel) + CFG.shifts.map(s => opt(s.id, s.name, sel)).join('');
  return `
  <div class="grid">
    ${kpi('พนักงานทั้งหมด', emps.length, 'คน')}
    ${CFG.shifts.map(s => kpi('กะ ' + esc(s.name), emps.filter(e => EMP[e.id]?.shift === s.id).length, 'คน (กะประจำ)')).join('')}
    ${kpi('ยังไม่ได้ตั้งกะ', unassigned, CFG.general.guessShift ? 'ระบบเดาจากเวลาสแกนให้' : 'ไม่คำนวณมาสาย', unassigned ? 'warn' : '')}
  </div>
  <div class="card">
    <div class="toolbar">
      <input type="text" id="search" placeholder="ค้นหาชื่อ / รหัส / ตำแหน่ง">
      <span style="margin-left:auto" class="muted small">ที่เลือกไว้ →</span>
      <select id="bulkShift">${shiftOpts('')}</select>
      <button class="btn" data-act="bulkShift">ตั้งกะให้คนที่เลือก</button>
      <button class="btn" data-act="useGuess" title="ตั้งกะประจำ = กะที่ระบบเดาบ่อยสุดในเดือนที่เลือก">ใช้กะที่ระบบเดา</button>
      <label class="btn upl" title="ไฟล์ Excel ที่มีคอลัมน์ รหัสพนักงาน และ กะ">นำเข้า Excel<input type="file" id="empIn" accept=".xlsx,.xls" hidden></label>
    </div>
    <div class="scroll"><table>
      <thead><tr><th><input type="checkbox" id="chkAll"></th><th>รหัส</th><th>ชื่อ</th><th>ตำแหน่ง</th><th>กะประจำ</th><th>ระบบเดา (${month ? thMonth(month) : '–'})</th><th>เปลี่ยนกะชั่วคราว</th></tr></thead>
      <tbody>${emps.map(e => { const cfg = EMP[e.id] || {}, g = guess[e.id] ? Object.entries(guess[e.id]).sort((a,b) => b[1] - a[1])[0] : null, ov = cfg.ov || [];
        return `<tr data-s="${esc((e.name + ' ' + e.id + ' ' + e.pos).toLowerCase())}">

        <td><select data-emp-shift="${esc(e.id)}">${shiftOpts(cfg.shift || '')}</select></td>
        <td class="guess">${g ? `${esc(g[0])} <span class="small">(${g[1]} วัน)</span>` : ''}</td>
        <td><button class="btn sm" data-act="empOpen" data-id="${esc(e.id)}">${ov.length ? ov.length + ' รายการ · แก้ไข' : '+ เพิ่ม'}</button></td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">ยังไม่มีพนักงาน อัปโหลดไฟล์ก่อน</td></tr>'}</tbody>
    </table></div>
    <p class="hint">ลำดับการเลือกกะของแต่ละวัน: เปลี่ยนกะชั่วคราว (อันที่เพิ่มล่าสุดชนะ) → กะประจำ → เดาจากเวลาสแกนเข้า (ถ้าเปิดไว้ในตั้งค่า) · นำเข้า Excel ได้ โดยมีคอลัมน์ "รหัสพนักงาน" และ "กะ" (ใส่ชื่อกะหรือเวลาเข้า เช่น 03.00)</p>
  </div>`;

async function connect(token, errEl) {
  const prev = CONN.token; CONN.token = token.trim();
  setSync('busy', 'ทดสอบ…');
  try {
    const m = await api('meta');
    saveConn();
    if (!Object.keys(m.months).length && Object.keys(DB).length) markAllPending(); // ชีตว่าง → ส่งข้อมูลในเครื่องขึ้นไป
    await sync(true);
    return true;
  } catch (e) {
    CONN.token = prev; setSync('err', e.message);
    if (errEl) errEl.textContent = 'เชื่อมต่อไม่ได้: ' + e.message;
    return false;
  }
}

function condSummary(s) {
  const cs = (s.conds || []).filter(k => k.f);

  return cs.map(k => { const F = FIELDS[k.f], o = (OPS[F?.type] || []).find(x => x[0] === k.op);
    let v = k.v; if (F?.type === 'sel') v = (F.opts().find(x => String(x[0]) === String(k.v)) || [])[1] ?? k.v;
    return `${F?.label} ${o ? o[1] : ''} ${['empty','notEmpty'].includes(k.op) ? '' : v ?? ''}`.trim(); }).join(s.mode === 'any' ? ' หรือ ' : ' และ ');
}

let SYNC = { state:'', at:0, msg:'' }, syncing = null, pushTimer = null;
const recToRow = (k, r) => [k, r.date, r.id, r.name, r.pos, r.branch, r.empStatus || '', r.raw, r.src || '', r.u || '', r.prev ?? ''];
function rowToRec(a) {
  const k = String(a[0]), [id, date] = k.split('|');
  const r = { id, date, name:String(a[3]), pos:String(a[4]), branch:String(a[5]), empStatus:String(a[6]), raw:String(a[7]), src:String(a[8]), u:+a[9] || 0 };
  if (a[10] !== '' && a[10] != null) r.prev = String(a[10]);
  return [k, r];
}
const sumToRow = (k, s) => [k, s.id, s.month, s.absent, s.lateN, s.lateMin, s.earlyN, s.earlyMin];
const rowToSum = a => [String(a[0]), { id:String(a[1]), month:String(a[2]), absent:+a[3] || 0, lateN:+a[4] || 0, lateMin:+a[5] || 0, earlyN:+a[6] || 0, earlyMin:+a[7] || 0 }];
const STORE = {
  CFG:  { get:() => { const c = clone(CFG); delete c.look; return c; }, set:v => { CFG = mergeCfg({ ...v, look:CFG.look }); persist(K.cfg, CFG); } },
  EMP:  { get:() => EMP,  set:v => { EMP = v || {}; persist(K.emp, EMP); } },
  WARN: { get:() => WARN, set:v => { WARN = v || []; persist(K.warn, WARN); } },

};
function syncText() {
  if (!CONN.url) return 'ยังไม่ได้เชื่อมต่อ';
  if (!CONN.token) return 'ยังไม่ได้ใส่รหัสลับ';

  if (SYNC.state === 'err') return 'ซิงค์ไม่สำเร็จ: ' + SYNC.msg;
  const n = Object.keys(PEND.rows).length + Object.keys(PEND.store).length;
  if (SYNC.at) return `ซิงค์ล่าสุด ${new Date(SYNC.at).toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' })}${n ? ` · รอส่ง ${n} รายการ` : ''}`;
  return n ? `รอส่ง ${n} รายการ` : 'เชื่อมต่อแล้ว';

function setSync(state, msg = '') {
  SYNC.state = state; SYNC.msg = msg; if (state === 'ok') SYNC.at = Date.now();

  b.hidden = !CONN.url;

async function api(action, payload = {}) {
  const res = await fetch(CONN.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ action, token:CONN.token, ...payload }) });
  let j; try { j = await res.json(); } catch { throw new Error('ตอบกลับไม่ใช่ JSON (ตรวจ URL และการ Deploy ให้ "ทุกคน" เข้าถึงได้)'); }
  if (!j.ok) throw new Error(j.error || 'ผิดพลาด');
  return j;
}

/* ส่งของที่ค้างก่อน แล้วค่อยดึงเดือนที่มีคนอื่นแก้ */
function sync(quiet) {
  if (!CONN.url || !CONN.token) return Promise.resolve();
  if (syncing) return syncing;
  syncing = (async () => {
    setSync('busy');
    try {
      // 1) ส่งข้อมูลสแกนที่ค้าง
      const keys = Object.keys(PEND.rows).filter(k => DB[k]);
      for (let i = 0; i < keys.length; i += 3000) {
        const part = keys.slice(i, i + 3000);
        setSync('busy', `ส่ง ${Math.min(i + 3000, keys.length)}/${keys.length}`);
        const sk = i === 0 ? Object.keys(PEND.sums).filter(k => SUM[k]) : [];
        // ไม่อัปเดต META ของเดือนที่ส่ง เพื่อให้รอบดึงข้อมูลโหลดเดือนนั้นซ้ำ เผื่อเครื่องอื่นแก้พร้อมกัน
        await api('upsert', { rows:part.map(k => recToRow(k, DB[k])), sums:sk.map(k => sumToRow(k, SUM[k])) });
        part.forEach(k => delete PEND.rows[k]); sk.forEach(k => delete PEND.sums[k]);
        saveSync();
      }
      PEND.rows = {}; if (!keys.length && Object.keys(PEND.sums).length) {
        const sk = Object.keys(PEND.sums).filter(k => SUM[k]);
        if (sk.length) await api('upsert', { rows:[], sums:sk.map(k => sumToRow(k, SUM[k])) });
        PEND.sums = {};
      }
      // 2) ส่งการตั้งค่า / กะ / ใบเตือน ที่ค้าง
      for (const k of Object.keys(PEND.store)) {
        const r = await api('setStore', { key:k, value:JSON.stringify(STORE[k].get()) });
        META.store[k] = r.u; delete PEND.store[k];
      }
      saveSync();
      // 3) ดึงเฉพาะเดือน/ข้อมูลที่ใหม่กว่าในเครื่อง
      const m = await api('meta');
      const need = Object.entries(m.months).filter(([mo, x]) => (META.months[mo] || 0) < x.u).map(([mo]) => mo).sort();
      let changedAny = false;
      for (let i = 0; i < need.length; i += 3) {
        const ms = need.slice(i, i + 3);
        setSync('busy', `โหลด ${ms.join(', ')}`);
        const r = await api('getMonths', { months:ms });
        Object.values(r.rows).flat().forEach(a => { const [k, rec] = rowToRec(a); if (!PEND.rows[k]) DB[k] = rec; });
        (r.sums || []).forEach(a => { const [k, s] = rowToSum(a); if (!PEND.sums[k]) SUM[k] = s; });
        ms.forEach(mo => META.months[mo] = m.months[mo].u);
        changedAny = true;
      }
      const sk = Object.keys(m.store).filter(k => STORE[k] && (META.store[k] || 0) < m.store[k] && !PEND.store[k]);
      if (sk.length) {
        const r = await api('getStore', { keys:sk });
        Object.entries(r.values).forEach(([k, v]) => { try { STORE[k].set(JSON.parse(v)); } catch {} META.store[k] = m.store[k]; });
        changedAny = true;
      }
      if (changedAny) { CACHE.clear(); saveDB(); persist(K.sum, SUM); applyLook(); }
      saveSync();
      setSync('ok');
      if (changedAny) render();
    } catch (e) {
      setSync('err', e.message);
      if (!quiet) toast('ซิงค์ไม่สำเร็จ: ' + e.message);
    } finally { syncing = null; }
  })();
  return syncing;
}

  switch (a) {
    case 'tab': state.tab = ds.tab; state.dayF = null; render(); scrollTo(0, 0); break;
    case 'go': state.tab = ds.tab; if (ds.sort) state.sort = { k:ds.sort, d:-1 }; closeModal(); render(); scrollTo(0, 0); break;
    case 'date': if (ds.date) { state.date = ds.date; state.tab = 'day'; render(); } break;
    case 'dayf': state.dayF = state.dayF === ds.f ? null : ds.f; render(); if (state.dayF) $('#dayTable')?.scrollIntoView({ behavior:'smooth', block:'start' }); break;
    case 'person': openPerson(ds.id); break;
    case 'sort': { const k = ds.k; state.sort = ds.d ? { k, d:+ds.d } : { k, d: state.sort.k === k ? -state.sort.d : 1 }; render(); break; }
    case 'close': closeModal(); break;
    case 'export': exportXlsx(); break;
    /* ใบเตือน */
    case 'warnf': state.warnF = ds.f; render(); break;
    case 'warnIssue': openWarnForm({ emp:ds.id, rule:ds.rule, pkey:ds.pkey }); break;
    case 'warnNew': openWarnForm({}); break;
    case 'warnNewFor': openWarnForm({ emp:ds.id }); break;
    case 'warnSave': {
      if (!wDraft.emp) { $('#wErr').textContent = 'เลือกพนักงานก่อน'; break; }
      if (!wDraft.reason.trim()) { $('#wErr').textContent = 'ใส่เหตุผลก่อน'; break; }
      const emp = allEmployees().find(x => x.id === wDraft.emp), rule = CFG.rules.find(r => r.id === wDraft.rule);
      WARN.push({ id:uid('w'), emp:wDraft.emp, name:emp?.name || wDraft.emp, date:wDraft.date || today(), level:wDraft.level, reason:wDraft.reason.trim(),
        rule:wDraft.rule || '', ruleName:rule?.name || '', pkey:wDraft.pkey || '', ts:Date.now(), void:false });
      saveWarn(); closeModal(); render(); toast('บันทึกใบเตือนแล้ว'); break;
    }
    case 'warnVoid': { const w = WARN.find(x => x.id === ds.wid); if (w) { w.void = !w.void; saveWarn(); render(); } break; }
    case 'warnDel': if (confirm('ลบใบเตือนนี้ถาวร?')) { WARN = WARN.filter(x => x.id !== ds.wid); saveWarn(); render(); } break;
    case 'warnExport': { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(warnRows()), 'ใบเตือน'); XLSX.writeFile(wb, `warnings_${today()}.xlsx`); break; }
    /* กะพนักงาน */
    case 'empOpen': openEmp(ds.id); break;
    case 'ovType': oDraft.type = ds.t; openEmp(oEmp); break;
    case 'ovWd': { const w = oDraft.wd; const k = w.indexOf(i); k < 0 ? w.push(i) : w.splice(k, 1); openEmp(oEmp); break; }
    case 'ovAddDate': if (oDraft._date && !oDraft.dates.includes(oDraft._date)) { oDraft.dates.push(oDraft._date); oDraft.dates.sort(); } openEmp(oEmp); break;
    case 'ovRmDate': oDraft.dates.splice(i, 1); openEmp(oEmp); break;
    case 'ovAdd': {
      const o = oDraft, err = m => $('#oErr').textContent = m;
      if (!o.shift) { err('ยังไม่มีกะ เพิ่มกะในหน้าตั้งค่าก่อน'); break; }
      if (o.type === 'range' && !o.from) { err('เลือกวันเริ่มก่อน'); break; }
      if (o.type === 'range' && o.to && o.to < o.from) { err('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม'); break; }
      if (o.type === 'dates' && !o.dates.length) { err('เพิ่มวันอย่างน้อย 1 วัน'); break; }
      if (o.type === 'weekdays' && !o.wd.length) { err('เลือกวันในสัปดาห์อย่างน้อย 1 วัน'); break; }
      const rec = { id:uid('o'), type:o.type, shift:o.shift };
      if (o.type === 'dates') rec.dates = [...o.dates];
      else { rec.from = o.from; rec.to = o.type === 'range' ? (o.to || o.from) : o.to; if (o.type === 'weekdays') rec.wd = [...o.wd].sort(); }
      const ent = EMP[oEmp] ??= {}; (ent.ov ??= []).push(rec);
      saveEmp(); oDraft = null; openEmp(oEmp); render(); toast('เพิ่มการเปลี่ยนกะแล้ว'); break;
    }
    case 'ovDel': EMP[oEmp].ov.splice(i, 1); saveEmp(); openEmp(oEmp); render(); break;
    case 'bulkShift': {
      const ids = [...document.querySelectorAll('.empChk:checked')].map(x => x.dataset.id);
      if (!ids.length) { toast('ติ๊กเลือกพนักงานก่อน'); break; }
      const s = $('#bulkShift').value; ids.forEach(id => (EMP[id] ??= {}).shift = s);
      saveEmp(); render(); toast(`ตั้งกะให้ ${ids.length} คนแล้ว`); break;
    }
    case 'useGuess': {
      if (!state.month) break;
      const g = {};
      Object.values(DB).filter(r => r.date.startsWith(state.month)).forEach(r => { const c = enrich(r); if (c.shiftGuess) { (g[r.id] ??= {})[c.shift.id] = (g[r.id][c.shift.id] || 0) + 1; } });
      const ids = Object.keys(g); if (!ids.length) { toast('ไม่มีคนที่ต้องเดากะ'); break; }
      if (!confirm(`ตั้งกะประจำให้ ${ids.length} คน ตามกะที่ระบบเดาบ่อยสุดใน ${thMonth(state.month)}?`)) break;
      ids.forEach(id => (EMP[id] ??= {}).shift = Object.entries(g[id]).sort((a,b) => b[1] - a[1])[0][0]);
      saveEmp(); render(); toast('ตั้งกะแล้ว'); break;
    }
    /* ตั้งค่า */
    case 'shiftAdd': CFG.shifts.push({ id:uid('s'), name:'กะใหม่', start:'08:00', end:'17:00', grace:0 }); cfgChanged(); break;
    case 'shiftDel': if (confirm(`ลบกะ "${CFG.shifts[i].name}"? พนักงานที่อยู่กะนี้จะกลายเป็นไม่ระบุกะ`)) { CFG.shifts.splice(i, 1); cfgChanged(); } break;
    case 'stUp': case 'stDown': { const j = a === 'stUp' ? i - 1 : i + 1; const s = CFG.statuses; [s[i], s[j]] = [s[j], s[i]]; cfgChanged(); break; }
    case 'stDel': if (confirm(`ลบสถานะ "${CFG.statuses[i].name}"?`)) { CFG.statuses.splice(i, 1); cfgChanged(); } break;
    case 'stNew': openStatusEditor(null); break;
    case 'stEdit': openStatusEditor(i); break;
    case 'sMode': sDraft.mode = ds.m; renderStatusEditor(); break;
    case 'condAdd': sDraft.conds.push({ f:'raw', op:'contains', v:'' }); renderStatusEditor(); break;
    case 'condDel': sDraft.conds.splice(i, 1); renderStatusEditor(); break;
    case 'stTest': runStatusTest(); break;
    case 'stSave': {
      if (!sDraft.name.trim()) { $('#sErr').textContent = 'ใส่ชื่อสถานะก่อน'; break; }
      if (!sDraft.abbr.trim()) { $('#sErr').textContent = 'ใส่ตัวย่อก่อน'; break; }
      if (!sDraft.conds.some(k => k.f && k.op)) { $('#sErr').textContent = 'เพิ่มเงื่อนไขอย่างน้อย 1 ข้อ'; break; }
      sDraft.value = +sDraft.value || 0;
      if (sIdx == null) CFG.statuses.unshift(sDraft); else CFG.statuses[sIdx] = sDraft;
      closeModal(); cfgChanged(); toast('บันทึกสถานะแล้ว'); break;
    }
    case 'ruleAdd': CFG.rules.push({ id:uid('r'), name:'เงื่อนไขใหม่', metric:'lateCount', param:5, threshold:5, period:'month', days:30 }); cfgChanged(); break;
    case 'ruleDel': if (confirm(`ลบเงื่อนไข "${CFG.rules[i].name}"?`)) { CFG.rules.splice(i, 1); cfgChanged(); } break;
    case 'accentReset': CFG.look.accent = ''; cfgChanged(true); break;
    case 'backup': download(`attendance_backup_${today()}.json`, JSON.stringify({ app:'attendance', v:3, at:new Date().toISOString(), DB, CFG, EMP, WARN, CHG, SUM })); break;
    case 'resetCfg': if (confirm('คืนค่าตั้งค่าทั้งหมด (กะ สถานะ เงื่อนไข หน้าตา) เป็นค่าเริ่มต้น? ข้อมูลสแกน การตั้งกะพนักงาน และใบเตือนจะไม่ถูกลบ')) { CFG = clone(DEFAULTS); cfgChanged(); } break;
    case 'clear': if (confirm('ลบข้อมูลสแกนในเครื่องนี้? (ถ้าเชื่อม Google Sheets ไว้ จะโหลดกลับมาใหม่ตอนซิงค์ ข้อมูลใน Sheets ไม่ถูกลบ)')) { DB = {}; PEND.rows = {}; META.months = {}; CACHE.clear(); saveDB(); saveSync(); render(); } break;
    case 'changes': openChanges(); break;
    case 'chgClear': if (confirm('ล้างประวัติแก้ย้อนหลัง และเอาเครื่องหมายสีส้มในปฏิทินออก?')) {
      CHG = []; saveChg(); Object.entries(DB).forEach(([k, r]) => { if (r.prev != null) { delete r.prev; PEND.rows[k] = 1; } });
      CACHE.clear(); saveDB(); saveSync(); closeModal(); render(); if (CONN.url) sync(); } break;
    case 'syncNow':
      if (!CONN.url) { state.tab = 'settings'; render(); break; }
      if (!CONN.token) { openTokenPrompt(); break; }
      sync().then(() => SYNC.state === 'ok' && toast('ซิงค์แล้ว')); break;
    case 'connTest':
      if (!CONN.url) { toast('ใส่ URL ก่อน'); break; }
      if (!CONN.token) { toast('ใส่รหัสลับก่อน'); break; }
      connect(CONN.token).then(ok => { toast(ok ? 'เชื่อมต่อแล้ว ระบบจะบันทึกและดึงข้อมูลอัตโนมัติ' : 'เชื่อมต่อไม่ได้: ' + SYNC.msg); render(); });
      break;
    case 'tokenSave': {
      const v = $('#tokIn').value.trim();
      if (!v) { $('#tokErr').textContent = 'ใส่รหัสลับก่อน'; break; }
      t.disabled = true; $('#tokErr').textContent = 'กำลังเชื่อมต่อ…';
      connect(v, $('#tokErr')).then(ok => { t.disabled = false; if (ok) { closeModal(); render(); toast('เชื่อมต่อแล้ว ระบบจะบันทึกและดึงข้อมูลอัตโนมัติ'); } });
      break;
    }
    case 'disconnect':
      if (confirm('เลิกเชื่อมต่อ Google Sheets ในเครื่องนี้? (ข้อมูลในชีตไม่ถูกลบ ต้องใส่รหัสลับใหม่ถ้าจะใช้อีก)')) { CONN.token = ''; saveConn(); setSync(''); render(); }
      break;
    case 'pushAll': if (confirm(`ส่งข้อมูลทั้งหมดในเครื่องนี้ (${Object.keys(DB).length} รายการ) การตั้งค่า กะ และใบเตือน ขึ้น Sheets? (ทับข้อมูลวันเดียวกันใน Sheets)`)) { markAllPending(); sync(); } break;
    case 'pullAll': if (confirm('โหลดข้อมูลทุกเดือนจาก Sheets มาใหม่?')) { META = { months:{}, store:{} }; saveSync(); sync(); } break;
  }
});

document.addEventListener('change', async e => {
  const t = e.target, ds = t.dataset;
  if (t.classList.contains('fileIn')) { handleFiles([...t.files]); t.value = ''; return; }
  if (t.id === 'daySel') { state.date = t.value; render(); return; }
  if (t.id === 'month') { state.month = t.value; state.date = null; render(); return; }
  if (t.id === 'branch') { state.branch = t.value; render(); return; }
  if (t.id === 'shiftSel') { state.shift = t.value; render(); return; }
  if (t.id === 'chkAll') { document.querySelectorAll('tr:not([hidden]) .empChk').forEach(x => x.checked = t.checked); return; }
  if (ds.path) {
    let v = t.value;
    if (ds.type === 'num') v = v === '' ? '' : +v;
    if (ds.type === 'bool') v = t.checked;
    if (ds.type === 'lines') v = v.split('\n').map(s => s.trim()).filter(Boolean);
    setPath(CFG, ds.path, v);
    if (/^rules\.\d+\.metric$/.test(ds.path)) { const r = CFG.rules[+ds.path.split('.')[1]], M = METRICS[v]; r.param = M.param === 'num' ? 15 : M.param === 'status' ? CFG.statuses[0]?.key : ''; }
    cfgChanged(ds.path.startsWith('look.')); return; // หน้าตาเป็นค่าเฉพาะเครื่อง ไม่ซิงค์
  }
  if (ds.empShift !== undefined) { (EMP[ds.empShift] ??= {}).shift = t.value; saveEmp(); render(); return; }
  if (ds.sc) { // เงื่อนไขสถานะ
    const k = sDraft.conds[+ds.i]; k[ds.sc] = t.value;
    if (ds.sc === 'f') { const F = FIELDS[t.value]; k.op = OPS[F.type][0][0]; k.v = F.type === 'sel' ? String(F.opts()[0]?.[0] ?? '') : ''; }
    if (ds.sc !== 'v') renderStatusEditor();
    return;
  }
  if (ds.sd === 'countAs') { sDraft.countAs = t.value; renderStatusEditor(); return; }
  if (t.id === 'restoreIn') {
    try {
      const d = JSON.parse(await t.files[0].text());
      if (d.app !== 'attendance') throw 0;
      if (!confirm('กู้คืนจะเขียนทับข้อมูลทั้งหมดในเครื่องนี้ ดำเนินการต่อ?')) return;
      DB = d.DB || {}; CFG = mergeCfg(d.CFG); EMP = d.EMP || {}; WARN = d.WARN || []; CHG = d.CHG || []; SUM = d.SUM || {};
      CACHE.clear(); saveDB(); persist(K.sum, SUM); saveCfg(); saveEmp(); saveWarn(); saveChg();
      if (CONN.url && confirm('ส่งข้อมูลที่กู้คืนขึ้น Google Sheets ด้วยไหม?')) { markAllPending(); sync(); }
      applyLook(); render(); toast('กู้คืนข้อมูลแล้ว');
    } catch { toast('ไฟล์สำรองไม่ถูกต้อง'); }
    t.value = ''; return;
  }
  if (t.id === 'empIn') {
    try {
      const wb = XLSX.read(await t.files[0].arrayBuffer(), { type:'array' });
      let n = 0, miss = 0;
      wb.SheetNames.forEach(sn => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:false });
        const h = rows.findIndex(r => r.some(c => String(c).trim() === 'รหัสพนักงาน')); if (h < 0) return;
        const head = rows[h].map(c => String(c).trim()), ci = head.indexOf('รหัสพนักงาน'), si = head.indexOf('กะ');
        if (si < 0) return;
        rows.slice(h + 1).forEach(r => {
          const id = String(r[ci] || '').trim(), v = String(r[si] || '').trim(); if (!id || !v) return;
          const s = CFG.shifts.find(x => x.name === v || x.id === v) || CFG.shifts.find(x => toMin(x.start) === toMin(v.split(/[-–]/)[0].trim()));
          if (s) { (EMP[id] ??= {}).shift = s.id; n++; } else miss++;
        });
      });
      saveEmp(); render(); toast(`ตั้งกะ ${n} คน${miss ? ` · หากะไม่เจอ ${miss} แถว` : ''}`);
    } catch { toast('อ่านไฟล์ไม่ได้'); }
    t.value = ''; return;
  }
});

document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'search') {
    if (state.tab === 'emp') state.eq = t.value.trim(); else state.q = t.value.trim();
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('tr[data-s]').forEach(tr => tr.hidden = q && !tr.dataset.s.includes(q));
    return;
  }
  if (ds.sd && sDraft) {
    sDraft[ds.sd] = t.value;
    if (ds.sd === 'abbr' || ds.sd === 'color') { const p = $('#sPrev'); p.textContent = sDraft.abbr || '?'; p.style.setProperty('--c', sDraft.color); }
    return;
  }
  if (ds.sc === 'v' && sDraft) { sDraft.conds[+ds.i].v = t.value; return; }
  if (ds.w && wDraft) { wDraft[ds.w] = t.value; return; }
  if (ds.o && oDraft) { oDraft[ds.o] = t.value; return; }
});
document.addEventListener('change', e => { const ds = e.target.dataset; if (ds.w && wDraft) wDraft[ds.w] = e.target.value; if (ds.o && oDraft) oDraft[ds.o] = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.id === 'tokIn') $('[data-act="tokenSave"]')?.click();
});
['dragover','drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  if (ev === 'drop' && e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]);
}));

function markAllPending() {
  Object.keys(DB).forEach(k => PEND.rows[k] = 1);
  Object.keys(SUM).forEach(k => PEND.sums[k] = 1);
  Object.keys(STORE).forEach(k => PEND.store[k] = 1);
  saveSync();
}
document.addEventListener('change', e => {
  const c = e.target.dataset.conn; if (!c) return;
  CONN[c] = e.target.value.trim(); saveConn(); setSync('');
  const b = document.querySelectorAll('[data-act="syncNow"],[data-act="pushAll"],[data-act="pullAll"]'); b.forEach(x => x.disabled = !CONN.url);
});

boot();
</script>
</body>
</html>
